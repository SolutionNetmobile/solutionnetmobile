; /etc/php/8.5/fpm/pool.d/netmobile-recette.conf
; Pool dédié à la recette Solution Netmobile (utilisateur système séparé de Private VTC)

[netmobile-recette]
user = netmobile-recette
group = netmobile-recette

listen = /run/php/netmobile-recette.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Le code n'est lisible que dans le dossier de l'application
php_admin_value[open_basedir] = /var/www/netmobile/recette/:/tmp/:/usr/share/php/
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = Off
php_admin_flag[log_errors] = on
