# /etc/nginx/sites-available/netmobile-prod.conf
# Production Solution Netmobile — https://solution-netmobile.fr (www redirigé vers le domaine nu)

server {
    listen 80;
    listen [::]:80;
    server_name solution-netmobile.fr www.solution-netmobile.fr;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://solution-netmobile.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.solution-netmobile.fr;

    ssl_certificate     /etc/letsencrypt/live/solution-netmobile.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solution-netmobile.fr/privkey.pem;

    return 301 https://solution-netmobile.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name solution-netmobile.fr;

    ssl_certificate     /etc/letsencrypt/live/solution-netmobile.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solution-netmobile.fr/privkey.pem;

    root /var/www/netmobile/prod/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8M;

    access_log /var/log/nginx/netmobile-prod.access.log;
    error_log  /var/log/nginx/netmobile-prod.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/netmobile-prod.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Aucun script exécuté depuis les médias téléversés
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" always;
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
