# /etc/nginx/sites-available/netmobile-recette.conf
# Recette Solution Netmobile — https://recette.solution-netmobile.fr (protégée par mot de passe HTTP)

server {
    listen 80;
    listen [::]:80;
    server_name recette.solution-netmobile.fr;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://recette.solution-netmobile.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recette.solution-netmobile.fr;

    ssl_certificate     /etc/letsencrypt/live/recette.solution-netmobile.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recette.solution-netmobile.fr/privkey.pem;

    root /var/www/netmobile/recette/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8M;

    access_log /var/log/nginx/netmobile-recette.access.log;
    error_log  /var/log/nginx/netmobile-recette.error.log;

    # Recette non publique : mot de passe HTTP + pas d'indexation
    auth_basic "Recette Solution Netmobile";
    auth_basic_user_file /etc/nginx/htpasswd/netmobile-recette;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Contrôle de santé local (script de déploiement) sans mot de passe
    location = /up {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/netmobile-recette.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Aucun script exécuté depuis les médias téléversés
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
